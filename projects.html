<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="InnoVision - استشارات الذكاء الاصطناعي والتحول الرقمي">
    <title id="page-title">مشاريع سابقة | InnoVision</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo" aria-label="InnoVision - الصفحة الرئيسية">
                <img src="image/logo.png" alt="InnoVision Logo" onerror="this.style.display='none'">
                <span id="logo-text">InnoVision</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="services.html" id="nav-services">الخدمات</a></li>
                <li><a href="projects.html" id="nav-projects">مشاريع سابقة</a></li>
                <li><a href="testimonials.html" id="nav-testimonials">آراء العملاء</a></li>
                <li><a href="about.html" id="nav-about">عن الاستشاري</a></li>
                <li><a href="contact.html" id="nav-contact">اتصل بنا</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-icon" id="theme-toggle" aria-label="تبديل الوضع الداكن/المضيء">
                    <i class="fa-solid fa-moon"></i>
                    <span id="theme-text">الوضع الداكن</span>
                </button>
                <button class="btn-icon" id="lang-toggle" aria-label="Switch language / تبديل اللغة">
                    <i class="fa-solid fa-globe"></i> <span>English</span>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة" aria-expanded="false" aria-controls="navLinks">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>
    <main class="container">
                    <h2 class="section-title" id="projects-title">مشاريع سابقة (Case Studies)</h2>
            <div class="projects-grid" id="projectsGrid">
                <!-- تُبنى بواسطة JavaScript من مصفوفة الترجمات -->
            </div>
        
    </main>

    <footer>
        <div class="container">
            <p class="copyright" id="copyright-txt">© 2026 InnoVision - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <!-- Chat Widget -->
    <button class="chat-widget-btn" aria-label="فتح المساعد الذكي" aria-expanded="false" aria-controls="chatWidget">
        <i class="fa-solid fa-robot"></i>
        <span id="chat-btn-label">أسأل الرد الآلي</span>
    </button>

    <div class="chat-box" id="chatWidget">
        <div class="chat-header">
            <span><i class="fa-solid fa-robot"></i> <span id="chat-header-txt">مساعد ذكي</span></span>
            <button class="close-chat" aria-label="إغلاق المحادثة">&times;</button>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-msg bot">
                <span id="chat-welcome">مرحباً! اسألني عن الخبرات أو المشاريع!</span>
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="اكتب سؤالك...">
            <button><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
    <script src="js/translations.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
